<% if (page.title || page.published || page.author) { %>
<div class="title-and-info" data-pagefind-body>
  <%= render('_breadcrumbs.html') %>
  <% if (page.title) { %>
  <h1 data-pagefind-weight="10" data-pagefind-meta="title_html[data-title-html]" data-title-html="<%- page.titleHtml %>"><%= page.titleHtml %></h1>
  <% } %>

  <div class="info" data-pagefind-ignore>
    <% if (page.published) { %>
    <div class="publish-date">
      <time datetime="<%- isoDate(page.published) %>">
        <%- readableDate(page.published) %>
      </time>
    </div>
    <% } %>
    <% if (page.author) { %>
      <%= render('_author.html') %>
    <% } %>
  </div>
</div>
<% } %>
